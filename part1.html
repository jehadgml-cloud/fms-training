<!DOCTYPE html>
<html lang="en" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<meta name="theme-color" content="#0B3550">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AVH FMS Training">
<title>AVH FMS Training LMS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2314A297'/%3E%3Cstop offset='1' stop-color='%23C9A227'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath fill='url(%23g)' d='M12 1 3 5v6c0 5.5 4 10.7 9 12 5-1.3 9-6.5 9-12V5z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Cairo:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root {
    --navy: #0B3550; 
    --navy-dark: #072335; 
    --navy-soft: #104C73;
    --teal: #0E7F76; 
    --teal-light: #16A89E;
    --gold: #C09A1F; 
    --gold-light: #E7C95F;
    --bg: #F0F4F6; 
    --card: #FFFFFF; 
    --ink: #111E25; 
    --muted: #627A86;
    --danger: #D32F2F; 
    --success: #2E7D32; 
    --line: #E2EBF0;
    --radius: 20px; 
    --radius-sm: 12px;
    --shadow-sm: 0 4px 10px rgba(11, 53, 80, 0.04);
    --shadow: 0 12px 30px rgba(11, 53, 80, 0.08);
    --shadow-lg: 0 20px 50px rgba(11, 53, 80, 0.12);
    --font-sans: 'Manrope', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-arabic: 'Cairo', 'Manrope', system-ui, sans-serif;
  }
  
  * { 
    box-sizing: border-box; 
    transition: background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
  }
  
  svg { 
    width: 1em; 
    height: 1em; 
    display: inline-block; 
    vertical-align: -0.125em; 
    flex: none; 
  }
  
  html, body { 
    margin: 0; 
    padding: 0; 
    height: 100%; 
    scroll-behavior: smooth;
  }
  
  body {
    background: var(--bg); 
    color: var(--ink);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    line-height: 1.5;
  }
  
  html[dir="rtl"] body { 
    font-family: var(--font-arabic); 
  }
  
  .num { 
    font-family: 'Space Grotesk', var(--font-sans), monospace; 
    font-weight: 600;
  }
  
  button { 
    font-family: inherit; 
    cursor: pointer; 
    outline: none;
  }
  
  ::selection { 
    background: var(--teal-light); 
    color: #fff;
  }

  /* Scrollbar Customization */
  ::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }
  ::-webkit-scrollbar-track {
    background: var(--bg);
  }
  ::-webkit-scrollbar-thumb {
    background: rgba(11, 53, 80, 0.15);
    border-radius: 99px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: rgba(11, 53, 80, 0.3);
  }
  
  /* Animations */
  @keyframes fadeIn { 
    from { opacity: 0; transform: translateY(12px); } 
    to { opacity: 1; transform: translateY(0); } 
  }
  @keyframes scaleIn {
    from { opacity: 0; transform: scale(0.97); }
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes floatSlow { 
    0%, 100% { transform: translateY(0) rotate(var(--rot, 0deg)); } 
    50% { transform: translateY(-6px) rotate(var(--rot, 0deg)); } 
  }
  @keyframes pulseSoft {
    0%, 100% { box-shadow: 0 0 0 0 rgba(22, 168, 158, 0.4); }
    50% { box-shadow: 0 0 0 8px rgba(22, 168, 158, 0); }
  }

  .fade-in-el {
    animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  /* ---------- App shell ---------- */
  #app { 
    min-height: 100vh; 
    display: flex; 
    flex-direction: column; 
  }
  
  .topbar {
    display: flex; 
    align-items: center; 
    justify-content: space-between;
    padding: 12px 30px; 
    background: rgba(255, 255, 255, 0.85); 
    color: var(--navy);
    position: sticky; 
    top: 0; 
    z-index: 50; 
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(162, 185, 200, 0.25);
    box-shadow: 0 4px 20px rgba(11, 53, 80, 0.03);
  }
  
  .brand { 
    display: flex; 
    align-items: center; 
    gap: 14px; 
  }
  
  .logo-badge { 
    background: transparent; 
    border-radius: var(--radius-sm); 
    padding: 2px 4px; 
    display: flex; 
    align-items: center; 
  }
  
  .logo-badge img { 
    height: 38px; 
    width: auto; 
    display: block; 
  }
  
  .brand .mark {
    width: 40px; 
    height: 40px; 
    border-radius: 12px;
    background: linear-gradient(135deg, var(--teal-light), var(--navy));
    display: flex; 
    align-items: center; 
    justify-content: center; 
    flex: none;
    box-shadow: var(--shadow-sm);
  }
  
  .brand .mark svg { 
    width: 22px; 
    height: 22px; 
    fill: #fff; 
  }
  
  .brand-text .t1 { 
    font-weight: 800; 
    font-size: 16px; 
    letter-spacing: .2px; 
    color: var(--navy);
  }
  
  .brand-text .t2 { 
    font-size: 12px; 
    font-weight: 700;
    color: var(--muted); 
    letter-spacing: .5px; 
    text-transform: uppercase;
  }
  
  .top-actions { 
    display: flex; 
    align-items: center; 
    gap: 12px; 
  }
  
  .pill {
    display: flex; 
    align-items: center; 
    gap: 8px; 
    background: rgba(11, 53, 80, 0.04);
    border: 1px solid rgba(11, 53, 80, 0.08); 
    border-radius: 999px; 
    padding: 6px 14px;
    font-size: 13px; 
    font-weight: 700; 
    color: var(--navy);
  }
  
  .pill svg { 
    width: 15px; 
    height: 15px; 
    color: var(--teal);
  }
  
  .lang-toggle { 
    display: flex; 
    background: rgba(11, 53, 80, 0.05); 
    border-radius: 999px; 
    padding: 3px; 
    border: 1px solid rgba(11, 53, 80, 0.08);
  }
  
  .lang-toggle button {
    border: none; 
    background: transparent; 
    color: var(--muted); 
    padding: 5px 14px; 
    border-radius: 999px; 
    font-size: 12px; 
    font-weight: 800;
  }
  
  .lang-toggle button.active { 
    background: var(--navy); 
    color: #fff; 
    box-shadow: var(--shadow-sm);
  }
  
  .icon-btn {
    display: inline-flex; 
    align-items: center; 
    justify-content: center;
    width: 40px; 
    height: 40px; 
    border-radius: 12px; 
    border: 1px solid rgba(11, 53, 80, 0.12);
    background: #fff; 
    color: var(--navy);
  }
  
  .icon-btn svg { 
    width: 18px; 
    height: 18px; 
  }
  
  .icon-btn:hover { 
    background: var(--bg); 
    color: var(--teal);
    transform: translateY(-1px);
    box-shadow: var(--shadow-sm);
  }
  
  main { 
    flex: 1; 
    width: 100%; 
  }
  
  .wrap { 
    max-width: 1140px; 
    margin: 0 auto; 
    padding: 40px 24px 80px; 
    animation: scaleIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  
  .wrap.wide { 
    max-width: 1240px; 
  }
  
  .hidden { 
    display: none !important; 
  }
  
  /* ---------- Login ---------- */
  .login-grid {
    display: grid; 
    grid-template-columns: 1.1fr 1fr; 
    gap: 0;
    border-radius: var(--radius); 
    overflow: hidden; 
    box-shadow: var(--shadow-lg); 
    min-height: 580px;
    background: var(--card);
    border: 1px solid rgba(11, 53, 80, 0.08);
  }
  
  @media (max-width: 860px) {
    .login-grid { 
      grid-template-columns: 1fr; 
      min-height: 0; 
    }
    
    .polaroid-stack { 
      display: none; 
    }
    .login-foot { 
      margin-top: 10px; 
    }
  }
  
  .login-panel-l {
    background:
      radial-gradient(1200px 500px at -10% -10%, rgba(22, 168, 158, 0.30), transparent 70%),
      radial-gradient(900px 500px at 110% 120%, rgba(192, 154, 31, 0.25), transparent 70%),
      linear-gradient(150deg, var(--navy-dark), var(--navy));
    color: #fff; 
    padding: 50px; 
    display: flex; 
    flex-direction: column; 
    justify-content: space-between; 
    position: relative; 
    overflow: hidden;
  }
  
  
  
  .login-mark { 
    width: 60px; 
    height: 60px; 
    border-radius: 16px; 
    background: linear-gradient(135deg, var(--teal-light), var(--gold)); 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    box-shadow: 0 10px 24px rgba(0,0,0,0.2);
  }
  
  .login-mark svg { 
    width: 32px; 
    height: 32px; 
    fill: #fff; 
  }
  
  .login-title { 
    font-size: 32px; 
    font-weight: 800; 
    line-height: 1.2; 
    margin: 24px 0 12px; 
    position: relative; 
    letter-spacing: -0.5px;
  }
  
  .login-sub { 
    color: #CBDCE6; 
    font-size: 15px; 
    line-height: 1.6; 
    max-width: 440px; 
    position: relative;
  }
  
  .login-foot { 
    display: flex; 
    gap: 30px; 
    position: relative; 
    z-index: 2; 
  }
  
  .login-foot .stat b { 
    display: block; 
    font-size: 26px; 
    line-height: 1.1;
  }
  
  .login-foot .stat span { 
    font-size: 11px; 
    color: #92B2C4; 
    text-transform: uppercase; 
    letter-spacing: 1px;
    font-weight: 700;
  }
  
  .polaroid-stack { 
    position: absolute; 
    inset-inline-end: 10px; 
    top: 40px; 
    width: 170px; 
    height: 220px; 
    z-index: 1; 
  }
  
  .polaroid { 
    position: absolute; 
    width: 140px; 
    border-radius: 10px; 
    padding: 6px 6px 18px; 
    background: #fff; 
    box-shadow: 0 12px 28px rgba(0,0,0,0.3); 
    animation: floatSlow 6s ease-in-out infinite; 
  }
  
  .polaroid img { 
    width: 100%; 
    height: 90px; 
    object-fit: cover; 
    border-radius: 6px; 
    display: block; 
  }
  
  .polaroid.p1 { --rot: -8deg; transform: rotate(-8deg); top: 0; inset-inline-end: 25px; }
  .polaroid.p2 { --rot: 7deg; transform: rotate(7deg); top: 65px; inset-inline-end: -15px; animation-delay: .5s;}
  .polaroid.p3 { --rot: -3deg; transform: rotate(-3deg); top: 130px; inset-inline-end: 35px; animation-delay: 1s;}
  
  .login-panel-r { 
    padding: 50px; 
    display: flex; 
    flex-direction: column; 
    justify-content: center; 
    gap: 20px; 
  }
  
  .role-card {
    border: 1.5px solid var(--line); 
    border-radius: var(--radius); 
    padding: 22px; 
    display: flex; 
    gap: 18px; 
    align-items: flex-start;
    background: #fff;
    box-shadow: var(--shadow-sm);
  }
  
  .role-card:hover { 
    border-color: var(--teal-light); 
    box-shadow: var(--shadow); 
    transform: translateY(-2px); 
  }
  
  .role-ic { 
    width: 46px; 
    height: 46px; 
    border-radius: 14px; 
    background: linear-gradient(135deg, rgba(14, 127, 118, 0.1), rgba(192, 154, 31, 0.1)); 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    flex: none;
  }
  
  .role-ic svg { 
    width: 22px; 
    height: 22px; 
    stroke: var(--teal); 
  }
  
  .role-body { 
    flex: 1; 
  }
  
  .role-body h3 { 
    margin: 0 0 6px; 
    font-size: 18px; 
    font-weight: 700;
  }
  
  .role-body p { 
    margin: 0 0 12px; 
    font-size: 13.5px; 
    color: var(--muted); 
    line-height: 1.5;
  }
  
  .auth-head { 
    display: flex; 
    align-items: center; 
    gap: 16px; 
    margin-bottom: 10px; 
  }
  
  .auth-tabs { 
    display: flex; 
    gap: 6px; 
    background: var(--bg); 
    border-radius: 14px; 
    padding: 4px; 
    margin-bottom: 10px; 
    border: 1px solid rgba(11, 53, 80, 0.05);
  }
  
  .auth-tab { 
    flex: 1; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    gap: 8px; 
    border: none; 
    background: transparent; 
    padding: 10px 14px; 
    border-radius: 10px; 
    font-size: 13.5px; 
    font-weight: 800; 
    color: var(--muted); 
  }
  
  .auth-tab svg { 
    width: 16px; 
    height: 16px; 
  }
  
  .auth-tab.active { 
    background: #fff; 
    color: var(--navy); 
    box-shadow: var(--shadow-sm); 
  }
  
  .grid2 { 
    display: grid; 
    grid-template-columns: 1fr 1fr; 
    gap: 14px; 
  }
  
  .opt-lbl { 
    text-transform: none; 
    font-weight: 600; 
    letter-spacing: 0; 
    color: var(--muted); 
    font-size: 11px; 
  }
  
  .link-btn { 
    border: none; 
    background: transparent; 
    color: var(--teal); 
    font-weight: 800; 
    font-size: 13px; 
    padding: 6px 12px; 
    display: inline-flex; 
    align-items: center; 
    gap: 6px; 
    border-radius: 8px;
  }
  
  .link-btn:hover { 
    background: rgba(14, 127, 118, 0.05); 
    text-decoration: none; 
  }
  
  .admin-link-row { 
    text-align: center; 
    margin-top: 10px; 
    padding-top: 14px; 
    border-top: 1px dashed var(--line); 
  }
  
  .switch-note { 
    font-size: 13px; 
    color: var(--muted); 
    text-align: center; 
    margin: 14px 0 0; 
  }
  
  .switch-note a { 
    color: var(--teal); 
    font-weight: 800; 
    cursor: pointer; 
  }
  
  .switch-note a:hover { 
    text-decoration: underline; 
  }
  
  .note-mini { 
    font-size: 11px; 
    color: var(--muted); 
    text-align: center; 
    margin: 12px 0 0; 
    line-height: 1.5; 
  }
  
  input[type=text], select, input[type=password], input[type=number], input[type=date] {
    width: 100%; 
    padding: 12px 14px; 
    border-radius: var(--radius-sm); 
    border: 1.5px solid var(--line); 
    font-size: 14px; 
    font-family: inherit; 
    background: #F8FAFB;
    color: var(--ink);
  }
  
  input:focus, select:focus { 
    outline: none;
    border-color: var(--teal); 
    background: #fff;
    box-shadow: 0 0 0 4px rgba(22, 168, 158, 0.15);
  }
  
  label { 
    font-size: 11px; 
    font-weight: 800; 
    color: var(--muted); 
    text-transform: uppercase; 
    letter-spacing: .6px; 
    display: block; 
    margin: 12px 0 5px;
  }
  
  .btn {
    display: inline-flex; 
    align-items: center; 
    justify-content: center; 
    gap: 8px;
    border: none; 
    border-radius: var(--radius-sm); 
    padding: 12px 24px; 
    font-weight: 800; 
    font-size: 14.5px;
    transform: translateY(0);
    box-shadow: var(--shadow-sm);
  }
  
  .btn svg { 
    width: 16px; 
    height: 16px; 
  }
  
  .btn-primary { 
    background: var(--teal); 
    color: #fff; 
  }
  .btn-primary:hover { 
    background: var(--teal-light);
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(22, 168, 158, 0.3);
  }
  .btn-primary:active {
    transform: translateY(0);
  }
  
  .btn-gold { 
    background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 100%); 
    color: var(--navy-dark); 
    border: 1px solid rgba(192, 154, 31, 0.2);
  }
  
  .btn-gold:hover { 
    transform: translateY(-2px); 
    box-shadow: 0 8px 20px rgba(192, 154, 31, 0.3); 
  }
  .btn-gold:active { 
    transform: translateY(0); 
  }
  
  .btn-ghost { 
    background: #fff; 
    border: 1.5px solid var(--line); 
    color: var(--navy); 
  }
  
  .btn-ghost:hover { 
    border-color: var(--teal-light); 
    background: rgba(14, 127, 118, 0.02);
    transform: translateY(-1px);
    box-shadow: var(--shadow-sm);
  }
  
  .btn-block { 
    width: 100%; 
  }
  
  .btn[disabled] { 
    opacity: .4; 
    pointer-events: none; 
    box-shadow: none;
  }
  
  .err-text { 
    color: var(--danger); 
    font-size: 13px; 
    font-weight: 700; 
    min-height: 18px; 
    margin-top: 6px;
  }
  
  /* ---------- Employee dashboard ---------- */
  .dash-head { 
    display: flex; 
    align-items: center; 
    justify-content: space-between; 
    gap: 24px; 
    flex-wrap: wrap; 
    margin-bottom: 30px;
  }
  
  .whoami { 
    display: flex; 
    align-items: center; 
    gap: 16px; 
  }
  
  .avatar { 
    width: 60px; 
    height: 60px; 
    border-radius: 18px; 
    background: linear-gradient(135deg, var(--navy) 0%, var(--teal) 100%); 
    color: #fff; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    font-weight: 800; 
    font-size: 22px; 
    flex: none; 
    box-shadow: var(--shadow);
  }
  
  .whoami h2 { 
    margin: 0; 
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--navy);
  }
  
  .whoami .dep { 
    font-size: 13.5px; 
    color: var(--muted); 
    font-weight: 700; 
    margin-top: 4px;
  }
  
  .ring-wrap { 
    display: flex; 
    align-items: center; 
    gap: 16px; 
    background: #fff; 
    border-radius: 999px; 
    padding: 8px 24px 8px 8px; 
    box-shadow: var(--shadow);
    border: 1px solid rgba(11, 53, 80, 0.05);
  }
  
  .ring { 
    width: 58px; 
    height: 58px; 
    border-radius: 50%; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    position: relative; 
    flex: none;
  }
  
  .ring .hole { 
    position: absolute; 
    inset: 6px; 
    background: #fff; 
    border-radius: 50%; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    font-family: 'Space Grotesk', sans-serif; 
    font-weight: 800; 
    font-size: 14px;
    color: var(--navy);
  }
  
  .ring-label b { 
    display: block; 
    font-size: 14px;
    color: var(--navy);
  } 
  
  .ring-label span { 
    font-size: 12px; 
    color: var(--muted);
    font-weight: 600;
  }
  
  .course-hero {
    border-radius: var(--radius); 
    overflow: hidden; 
    box-shadow: var(--shadow); 
    position: relative; 
    color: #fff; 
    min-height: 380px;
    display: flex; 
    align-items: flex-end; 
    background: linear-gradient(150deg, rgba(7, 35, 53, 0.94) 0%, rgba(14, 127, 118, 0.85) 100%), var(--cover-img) center/cover no-repeat;
    border: 1px solid rgba(11,53,80,0.1);
  }
  
  .course-hero .inner { 
    padding: 50px; 
    width: 100%; 
    position: relative; 
    z-index: 2; 
  }
  
  .course-hero .eyebrow { 
    display: inline-flex; 
    align-items: center; 
    gap: 8px; 
    background: rgba(255, 255, 255, 0.15); 
    border: 1px solid rgba(255, 255, 255, 0.25); 
    padding: 6px 14px; 
    border-radius: 999px; 
    font-size: 11.5px; 
    font-weight: 800; 
    letter-spacing: 0.8px; 
    text-transform: uppercase; 
    margin-bottom: 20px;
    backdrop-filter: blur(4px);
  }
  
  .course-hero h2 { 
    font-size: clamp(24px, 4.5vw, 34px); 
    font-weight: 800;
    margin: 0 0 16px; 
    max-width: 680px; 
    line-height: 1.25; 
    letter-spacing: -0.5px;
  }
  
  .course-hero p { 
    margin: 0 0 30px; 
    color: #E2ECF0; 
    max-width: 640px; 
    font-size: clamp(14px, 2.5vw, 15.5px); 
    line-height: 1.65;
  }
  
  .course-hero-foot { 
    display: flex; 
    align-items: center; 
    gap: 30px; 
    flex-wrap: wrap; 
  }
  
  .hero-progress { 
    flex: 1; 
    min-width: 240px; 
    max-width: 380px; 
  }
  
  .hero-progress .track { 
    height: 8px; 
    border-radius: 99px; 
    background: rgba(255, 255, 255, 0.2); 
    overflow: hidden;
  }
  
  .hero-progress .fill { 
    height: 100%; 
    background: linear-gradient(90deg, var(--teal-light), var(--gold-light)); 
    border-radius: 99px;
  }
  
  .hero-progress .lbl {

body {
  background: var(--navy-dark);

    radial-gradient(circle at 15% 50%, rgba(14, 127, 118, 0.15), transparent 25%),
    radial-gradient(circle at 85% 30%, rgba(192, 154, 31, 0.1), transparent 25%);

}
.login-wrapper {
  position: relative;
  min-height: calc(100vh - 140px);
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
}
.ambient-bg {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: -1;
  overflow: hidden;
  pointer-events: none;
}
.blob {
  position: absolute;
  filter: blur(100px);
  opacity: 0.5;
  animation: float 20s infinite ease-in-out alternate;
}
.blob-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: rgba(14, 127, 118, 0.3); }
.blob-2 { bottom: -20%; right: -10%; width: 60vw; height: 60vw; background: rgba(192, 154, 31, 0.2); animation-delay: -5s; }
.blob-3 { top: 40%; left: 40%; width: 40vw; height: 40vw; background: rgba(11, 53, 80, 0.6); animation-delay: -10s; }

@keyframes float {
  0% { transform: translate(0, 0) scale(1); }
  100% { transform: translate(10%, 10%) scale(1.1); }
}

.login-glass-card {
  position: relative;
  z-index: 10;
  width: 100%;
  max-width: 500px;
  margin: 20px;
  background: rgba(255, 255, 255, 0.95);

  flex-direction: column;
}
.login-glass-header {
  padding: 40px 40px 20px;

  text-align: center;
}
.login-glass-body {
